<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="SafeGuard Securities official digital seal">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3d6e"/>
      <stop offset="55%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#0a3d6e"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="96" fill="#0b1f36"/>
  <circle cx="100" cy="100" r="90" fill="none" stroke="url(#ring)" stroke-width="6"/>
  <circle cx="100" cy="100" r="78" fill="none" stroke="#c9a24a" stroke-width="1.4"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#1e5a8a" stroke-width="8"/>
  <path id="topArc" d="M 32,100 A 68,68 0 0 1 168,100" fill="none"/>
  <path id="botArc" d="M 168,100 A 68,68 0 0 1 32,100" fill="none"/>
  <text fill="#c9a24a" font-family="Georgia, 'Times New Roman', serif" font-size="11" font-weight="700" letter-spacing="2.4">
