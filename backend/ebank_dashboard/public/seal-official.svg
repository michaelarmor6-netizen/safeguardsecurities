  </text>
  <text fill="#c9a24a" font-family="Georgia, 'Times New Roman', serif" font-size="9" font-weight="700" letter-spacing="2">
    <textPath href="#botArc" startOffset="50%" text-anchor="middle">OFFICIAL DIGITAL SEAL</textPath>
  </text>
  <polygon points="100,58 108,82 134,82 113,97 121,122 100,107 79,122 87,97 66,82 92,82" fill="#c9a24a"/>
  <text x="100" y="142" text-anchor="middle" fill="#e8eef6" font-family="Georgia, serif" font-size="9" letter-spacing="1.6">AUTHENTICATED</text>
  <text x="100" y="156" text-anchor="middle" fill="#c9a24a" font-family="Georgia, serif" font-size="8" letter-spacing="2">EST. DIGITAL</text>
</svg>
