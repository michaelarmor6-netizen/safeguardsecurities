services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    # Serve the static marketing site; cleanUrls-like behavior handled by
    # nginx try_files so /about resolves to /about/index.html.
    configs:
      - source: nginx_site
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped

configs:
  nginx_site:
    content: |
      server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Allow the preview's external hostname (sandbox id rotates).
        add_header Access-Control-Allow-Origin *;

        # WordPress-style clean URLs: /about -> /about/index.html
        location / {
          try_files $uri $uri/ $uri.html /index.html;
        }

        # Don't cache HTML during development.
        location ~* \.(html|htm)$ {
          add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
      }
