services:
  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    # Serve the static marketing site; cleanUrls-like behavior handled by
    # nginx try_files so /about resolves to /about/index.html.
    configs:
      - source: nginx_site
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped

  # One-shot Firebase Hosting deploy service. Run with:
  #   docker compose -f docker-compose.base44.yml run --rm deploy
  deploy:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./:/app
    env_file:
      - /run/base44/app.env
    entrypoint: ["sh", "-c"]
    command:
      - |
        npm install -g firebase-tools@latest &&
        firebase deploy --only hosting:marketing --token "$${FIREBASE_TOKEN}" --non-interactive
    profiles:
      - deploy

configs:
  nginx_site:
    content: |
      server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Allow the preview's external hostname (sandbox id rotates).
        add_header Access-Control-Allow-Origin *;

        # WordPress-style clean URLs: /about -> /about/index.html
        location / {
          try_files $uri $uri/ $uri.html /index.html;
        }

        # Don't cache HTML during development.
        location ~* \.(html|htm)$ {
          add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
      }
