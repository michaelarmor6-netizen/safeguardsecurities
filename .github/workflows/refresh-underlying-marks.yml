name: Refresh underlying marks

# Hourly contract marks for client option P/L. Cloud Functions cannot do this
# while the Firebase project is off the Blaze plan. GitHub's scheduler does
# not need Blaze. The job quotes the listed contract (not a live tick) and
# writes marketPrices, which the dashboard already reads.
on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/ebank_dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: backend/ebank_dashboard
        run: npm ci

      - name: Write hourly underlying marks
        working-directory: backend/ebank_dashboard
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/refresh-underlying-marks.mjs
