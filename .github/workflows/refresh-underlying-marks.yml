name: Refresh underlying marks

# Parked. Client P/L is posted by an admin on the holding, and Cloud Run
# stays off until the company turns the live feeds back on. This file no
# longer schedules itself. Re-add the hourly cron only when that feed should
# run again.
on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/ebank_dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: backend/ebank_dashboard
        run: npm ci

      - name: Write hourly underlying marks
        working-directory: backend/ebank_dashboard
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/refresh-underlying-marks.mjs
