name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/ebank_dashboard/package-lock.json

      - name: Install dashboard dependencies
        working-directory: backend/ebank_dashboard
        run: npm ci

      - name: Build dashboard
        working-directory: backend/ebank_dashboard
        env:
          # Investor platform. Without this, a checkout that has no .env
          # builds the older bank dashboard and replaces the live site.
          VITE_APP_MODE: safeguard
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Marketing site: static files served from the repo root config.
      - name: Deploy marketing hosting
        run: npx firebase-tools deploy --only hosting:marketing --project e-bank-dashboard --non-interactive

      # Dashboard app: its own firebase.json - HOSTING ONLY on purpose.
      # Functions, Firestore rules and Storage rules stay manual deploys
      # (they involve secrets and need a deliberate rollout).
      - name: Deploy dashboard hosting
        working-directory: backend/ebank_dashboard
        run: npx firebase-tools deploy --only hosting --project e-bank-dashboard --non-interactive
